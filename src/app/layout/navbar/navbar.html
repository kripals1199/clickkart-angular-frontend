<mat-toolbar class="navbar">

  <!-- MOBILE MENU BUTTON -->

  <button
    mat-icon-button
    class="mobile-menu-btn"
    (click)="toggleMobileMenu()"
  >
    <mat-icon>
      menu
    </mat-icon>
  </button>

  <!-- LOGO -->

  <div
    class="logo"
    routerLink="/"
  >
    <!-- ClickKart -->
    <img src="images/clickkart.png" class="logo1" alt="ClickKart Logo" />
   
  </div>

  <!-- SEARCH -->

  <div class="search-container">

    <input
      matInput
      type="text"
      placeholder="Search for products, brands and more"
      [ngModel]="search()"
      (ngModelChange)="search.set($event)"
      (keyup.enter)="submitSearch()"
    />

    <button mat-icon-button (click)="submitSearch()" aria-label="Search">
      <mat-icon>
        search
      </mat-icon>
    </button>

  </div>

  <!-- DESKTOP MENU -->

  <div class="desktop-menu">

    @if (isAuthenticated()) {

      <span class="account-email">{{ currentUser()?.email }}</span>

      <button
        mat-button
        routerLink="/account"
      >
        Account
      </button>

      <button
        mat-button
        routerLink="/orders"
      >
        Orders
      </button>

      <button
        mat-button
        (click)="logout()"
      >
        Logout
      </button>

    } @else {

      <button
        mat-button
        routerLink="/login"
      >
        Login
      </button>

      <button
        mat-button
        routerLink="/register"
      >
        Sign up
      </button>

    }

    <button mat-button>
      Seller
    </button>

    <!-- Hidden rather than showing a zero: an empty basket has nothing to announce. -->
    <button
      mat-icon-button
      routerLink="/cart"
      aria-label="Cart"
      [matBadge]="cartCount()"
      [matBadgeHidden]="cartCount() === 0"
      matBadgeColor="warn"
    >
      <mat-icon>
        shopping_cart
      </mat-icon>
    </button>

  </div>

</mat-toolbar>

<!-- MOBILE MENU -->

@if (mobileMenuOpen()) {

  <div class="mobile-menu">

    @if (isAuthenticated()) {

      <button
        mat-button
        routerLink="/account"
        (click)="toggleMobileMenu()"
      >
        Account
      </button>

      <button
        mat-button
        routerLink="/orders"
        (click)="toggleMobileMenu()"
      >
        Orders
      </button>

      <button
        mat-button
        (click)="logout()"
      >
        Logout
      </button>

    } @else {

      <button
        mat-button
        routerLink="/login"
        (click)="toggleMobileMenu()"
      >
        Login
      </button>

      <button
        mat-button
        routerLink="/register"
        (click)="toggleMobileMenu()"
      >
        Sign up
      </button>

    }

    <button mat-button>
      Become Seller
    </button>

    <button
      mat-button
      routerLink="/cart"
      (click)="toggleMobileMenu()"
    >
      Cart
    </button>

  </div>

}
