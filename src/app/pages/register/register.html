<section class="register">
  <form class="register__card" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <h1 class="register__title">Create your account</h1>

    @if (errorMessage()) {
      <p class="register__error" role="alert">{{ errorMessage() }}</p>
    }

    <label class="field">
      <span class="field__label">Email</span>
      <input type="email" formControlName="email" autocomplete="email" required />
      @if (form.controls.email.touched && form.controls.email.invalid) {
        <span class="field__hint">Enter a valid email address.</span>
      }
    </label>

    <label class="field">
      <span class="field__label">Mobile number</span>
      <input type="tel" formControlName="mobileNumber" autocomplete="tel-national" inputmode="numeric" required />
      @if (form.controls.mobileNumber.touched && form.controls.mobileNumber.invalid) {
        <span class="field__hint">10 digits, starting with 6, 7, 8 or 9.</span>
      }
    </label>

    <label class="field">
      <span class="field__label">Password</span>
      <input type="password" formControlName="password" autocomplete="new-password" required />
      @if (form.controls.password.touched && form.controls.password.invalid) {
        <span class="field__hint">
          At least 8 characters, with an uppercase letter, a lowercase letter, a number and a symbol.
        </span>
      }
    </label>

    <div class="captcha">
      @if (challenge(); as c) {
        <img class="captcha__image" [src]="'data:image/png;base64,' + c.imageBase64" alt="Type the characters shown in this image" />
        <button type="button" class="captcha__refresh" (click)="loadChallenge()">New image</button>
      } @else if (captchaFailed()) {
        <p class="captcha__error" role="alert">
          The captcha could not be loaded, so registration is unavailable right now.
        </p>
        <button type="button" class="captcha__refresh" (click)="loadChallenge()">Try again</button>
      } @else {
        <p class="captcha__loading">Loading captcha…</p>
      }
    </div>

    <label class="field">
      <span class="field__label">Type the characters above</span>
      <input type="text" formControlName="captchaAnswer" autocomplete="off" required />
    </label>

    <!-- Disabled without a challenge: there is deliberately no path to submit this form when the
         captcha is unavailable. -->
    <button type="submit" class="register__submit" [disabled]="submitting() || !challenge()">
      {{ submitting() ? 'Creating account…' : 'Create account' }}
    </button>

    <p class="register__alt">Already have an account? <a routerLink="/login">Sign in</a></p>
  </form>
</section>
