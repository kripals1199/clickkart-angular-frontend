@if (loading()) {

  <div class="category-container">
    @for (placeholder of [1,2,3,4,5,6,7,8]; track placeholder) {
      <div class="category-card category-card--skeleton" aria-hidden="true"></div>
    }
  </div>

} @else if (categories().length > 0) {

  <nav class="category-container" aria-label="Shop by category">
    @for (category of categories(); track category.publicId) {
      <a
        class="category-card"
        [routerLink]="['/products']"
        [queryParams]="{ categoryPublicId: category.publicId }"
      >
        @if (category.imageUrl) {
          <img class="category-card__image" [src]="category.imageUrl" [alt]="" />
        } @else {
          <span class="category-card__initial" aria-hidden="true">{{ initial(category) }}</span>
        }
        <span class="category-card__name">{{ category.name }}</span>
      </a>
    }
  </nav>

}
